name: Generate Org Metrics # 工作流名称

on: # 触发条件
  schedule: # 定时运行
    - cron: "0 0 * * *" # 每天 UTC 00:00 运行（JST 09:00）
  workflow_dispatch: # 支持手动触发

permissions: # 设置权限
  contents: write # 允许写入仓库内容

jobs:
  org-metrics: # 任务名称
    runs-on: ubuntu-latest # 运行环境
    steps:
      - uses: actions/checkout@v3 # 检出仓库代码
      - uses: lowlighter/metrics@latest # 使用 metrics Action
        with:
          token: ${{ secrets.METRICS_TOKEN }} # 自定义 PAT
          filename: org-metrics.svg # 输出文件名
          user: "" # 清空 user，切换到组织模式
          repo: ${{ github.repository }} # 当前仓库
          base: header, repositories # 显示头部和仓库统计
          plugin_introduction: yes # 启用简介插件
          plugin_introduction_title: "Our Organization Stats" # 自定义标题
          plugin_stars: yes # 显示 star 统计
          plugin_repositories: yes # 显示仓库列表
        env:
          ORGANIZATION: ${{ github.repository_owner }} # 组织名称
      - name: Commit & Push # 提交生成的文件
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update organization metrics"
          git push
